<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SEMED Oficinas</title>
  <style>
    :root{font-family:Inter,Segoe UI,Arial,sans-serif;--ink:#081d42;--muted:#60708e;--line:#c8d8f2;--bg:#f3f7ff;--brand:#003c8f;--blue:#0047ab;--soft:#fff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}button{border:0;border-radius:8px;padding:10px 14px;font-weight:900;cursor:pointer}.primary{background:linear-gradient(135deg,var(--brand),var(--blue));color:#fff}.ghost{background:#eaf2ff;color:var(--ink)}.danger{background:#fee2e2;color:#991b1b}.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(rgba(0,31,91,.84),rgba(0,71,171,.78))}.login form{width:min(460px,100%);display:grid;gap:15px;background:#fff;padding:30px;border-radius:10px;box-shadow:0 24px 70px #001f5b55}.login-logo{width:min(310px,100%);justify-self:center;border:1px solid var(--line);border-radius:8px;padding:8px}h1{margin:0;font-size:30px}h2{margin:0 0 12px;color:var(--brand)}p{color:var(--muted)}label{display:grid;gap:7px;font-size:13px;font-weight:900}input,select{min-height:42px;border:1px solid var(--line);border-radius:8px;padding:10px;background:#fff;color:var(--ink)}.shell{display:grid;grid-template-columns:280px 1fr;min-height:100vh}.side{background:linear-gradient(180deg,#001f5b,#003c8f);color:#fff;padding:18px;display:flex;flex-direction:column;gap:6px}.semed-logo{width:100%;background:#fff;border-radius:8px;padding:6px}.brand{font-weight:950;font-size:13px;text-transform:uppercase;margin:8px 0 16px}.side button{width:100%;text-align:left;background:transparent;color:#e8f1ff;border:1px solid transparent;text-transform:uppercase}.side button.active,.side button:hover{background:#ffffff22;border-color:#ffffff55}.side-footer{margin-top:auto}.logout-side{background:#eaf2ff!important;color:#081d42!important;text-align:center!important}.detic-logo img{width:120px}.detic-logo span{display:block;font-size:10px;text-transform:uppercase;color:#d5e5ff}.top{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:2}.content{padding:24px;display:grid;gap:18px}.panel,.stat{background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 28px #003c8f14}.panel{padding:18px;overflow:hidden}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.stat{padding:18px;border-left:5px solid var(--blue)}.stat span{display:block;color:var(--muted);font-weight:900;text-transform:uppercase;font-size:12px}.stat strong{font-size:30px}.form{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:12px}.form h2{grid-column:1/-1;border-top:1px solid var(--line);padding-top:14px;margin-top:8px}.form h2:first-child{border:0;padding:0}.actions{grid-column:1/-1;display:flex;justify-content:flex-end;gap:10px}.toolbar,.tabs{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select{min-width:210px}.table{overflow:auto;border:1px solid var(--line);border-radius:10px}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:11px;border-bottom:1px solid var(--line);font-size:13px;text-align:left}th{background:#eaf2ff;color:var(--brand);text-transform:uppercase}.submenu{margin-left:10px;border-left:2px solid #fff8;padding-left:8px}.submenu button{font-size:11px;min-height:34px}.warn{color:#c2410c;font-weight:900}.toast{position:fixed;inset:0;display:grid;place-items:center;background:#001f5b33;z-index:9}.toast div{background:#fff;color:var(--brand);font-weight:950;padding:24px;border-radius:10px;box-shadow:0 20px 60px #001f5b44}@media(max-width:900px){.shell{grid-template-columns:1fr}.side{min-height:auto}.grid,.form{grid-template-columns:1fr 1fr}}@media(max-width:620px){.grid,.form{grid-template-columns:1fr}.content{padding:14px}.toolbar input,.toolbar select{min-width:100%}}
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module" src="./supabase-init.js"></script>
  <script src="./app.js"></script>
</body>
</html>
